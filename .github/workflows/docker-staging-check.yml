name: Docker staging check
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Docker versions
        run: docker --version && docker compose version
      - name: Build, start and verify (staging)
        working-directory: deploy
        run: sh ./verify-staging.sh
