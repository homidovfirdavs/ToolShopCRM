# ToolShop CRM - Docker Compose (Nginx HTTPS + API + PostgreSQL).
# Run from this folder:  docker compose --env-file .env up -d --build
# Secrets come ONLY from deploy/.env (not in git). See docs/DEPLOYMENT.tj.md.
name: toolshop

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_OWNER:-toolshop_owner}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD in deploy/.env}
      POSTGRES_DB: ${DB_NAME:-toolshop_crm}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/db:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    networks: [backend]          # not published to the host, not on the public network

  # one-shot job: least-privilege role -> EF migrations (idempotent) -> grants. Safe to re-run; never drops data.
  migrate:
    build: { context: ../backend, target: migrate }
    image: toolshop-migrate:local
    restart: "no"
    user: postgres
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: ${DB_OWNER:-toolshop_owner}
      PGPASSWORD: ${DB_OWNER_PASSWORD:?}
      PGDATABASE: ${DB_NAME:-toolshop_crm}
      APP_DB_USER: ${APP_DB_USER:-toolshop_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in deploy/.env}
    volumes:
      - ./db:/db:ro
    entrypoint: ["sh", "/db/migrate.sh"]
    networks: [backend]

  api:
    build: { context: ../backend, target: runtime }
    image: toolshop-api:local
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Https__Redirect: "false"      # TLS ends at Nginx
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${DB_NAME:-toolshop_crm};Username=${APP_DB_USER:-toolshop_app};Password=${APP_DB_PASSWORD:?}
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in deploy/.env}
      Jwt__Issuer: ${JWT_ISSUER:-toolshop-crm}
      Jwt__Audience: ${JWT_AUDIENCE:-toolshop-crm-users}
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN, e.g. https://crm.example.com}
      AdminUser__Username: ${ADMIN_USERNAME:-}
      AdminUser__Email: ${ADMIN_EMAIL:-}
      AdminUser__Password: ${ADMIN_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - dpkeys:/home/app/.aspnet/DataProtection-Keys
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend, frontend]

  web:
    build:
      context: ../frontend/toolshop-client
      args:
        VITE_API_URL: /api
        APP_BUILD_ID: ${APP_BUILD_ID:-}
    image: toolshop-web:local
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      PUBLIC_HTTPS_PORT: ${HTTPS_PORT:-443}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-31536000}
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    volumes:
      - ./certs:/etc/nginx/certs:ro      # fullchain.pem + privkey.pem (not in git)
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d:uid=101,gid=101,mode=755   # rendered config
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [frontend]

  # optional: scheduled backups ->  docker compose --profile backup up -d backup
  backup:
    profiles: [backup]
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: ${DB_OWNER:-toolshop_owner}
      PGPASSWORD: ${DB_OWNER_PASSWORD:?}
      PGDATABASE: ${DB_NAME:-toolshop_crm}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - ./db:/db:ro
      - ./backups:/backups
    entrypoint: ["sh", "-c", "while true; do sh /db/backup.sh || echo 'backup FAILED'; sleep $$((BACKUP_INTERVAL_HOURS*3600)); done"]
    networks: [backend]

networks:
  backend:
    internal: true      # db <-> api <-> migrate only; no internet, no host access
  frontend: {}

volumes:
  pgdata:
  dpkeys:
